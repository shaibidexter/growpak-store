# GrowPak Store - Nginx Production Configuration

upstream api_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream web_ssr_upstream {
    server 127.0.0.1:4200;
    keepalive 64;
}

server {
    listen 80;
    server_name growpak.store www.growpak.store;

    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API endpoints reverse proxy
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static uploads and media
    location /uploads/ {
        alias /var/www/growpak-store/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Admin Portal static build
    location /admin {
        alias /var/www/growpak-store/dist/apps/admin/browser;
        try_files $uri $uri/ /admin/index.html;
    }

    # Frontend Angular SSR
    location / {
        proxy_pass http://web_ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
